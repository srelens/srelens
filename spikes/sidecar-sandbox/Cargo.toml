[package]
name = "sidecar-sandbox-spike"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Feasibility spike for #571: can each OS sandbox enforce the executable-extension restrictions?"

# Its own workspace, not a member of the root one, like fuzz/: a throwaway prototype must not
# change `cargo check --workspace`, the root lockfile or CI.
[workspace]
members = ["."]

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
