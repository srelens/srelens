[workspace]
resolver = "2"
members = ["crates/agent", "crates/capability", "crates/mcp", "crates/kube", "crates/streams", "crates/server", "crates/registry", "crates/llm", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "MIT"

# Fast-feedback profile for the CI WebDriver smoke job (issue #30): dev
# semantics, but no debuginfo — its generation and linking dominate the
# app-binary build time there, and the smoke suite never reads symbols.
[profile.ci-smoke]
inherits = "dev"
debug = 0
strip = "debuginfo"
