[workspace]
resolver = "2"
members = ["crates/plugin-host", "crates/agent", "crates/capability", "crates/mcp", "crates/kube", "crates/streams", "crates/server", "crates/registry", "crates/llm", "apps/desktop/src-tauri", "apps/tui", "sdk/protocol", "sdk/rust", "sdk/examples/hello-world/rust"]

[workspace.package]
edition = "2021"
version = "0.16.0"
license = "MIT"

# Fast-feedback profile for the CI WebDriver smoke job (issue #30): dev
# semantics, but no debuginfo — its generation and linking dominate the
# app-binary build time there, and the smoke suite never reads symbols.
[profile.ci-smoke]
inherits = "dev"
debug = 0
strip = "debuginfo"

# Release binaries ship without a symbol table. Nothing symbolicates a user's
# crash dump, so on Linux and macOS the table is only download weight; on
# Windows it changes nothing, because MSVC keeps symbols in a .pdb that no
# bundle ships. Set here rather than in a workflow's RUSTFLAGS so that every
# release build gets it: the desktop app tauri-action bundles, the sandbox
# launcher macOS builds in a step of its own, srectl and the server image.
# For a symbolized backtrace or a profile, build with
# CARGO_PROFILE_RELEASE_STRIP=false.
[profile.release]
strip = true
# Optimize for size. On the Windows desktop binary "s" took 76.2 MiB to 50.1
# (15.1 to 11.1 MiB under xz -9), and the build got faster. It also makes code
# slower, so the crates whose speed someone waits on stay at 3, below.
opt-level = "s"

# The crates kept at opt-level 3. Generic code, serde above all, is compiled in
# the crate that instantiates it, so these are where the hot paths end up:
# - srelens-registry and srelens-plugin-host: every broker call re-reads and
#   re-validates the app inventory. At "s" the extension budgets in
#   crates/registry/src/extensions/budget_tests.rs ran 11-38% slower; with
#   these two at 3, within 10%.
# - srelens-kube: every Kubernetes list and watch is decoded here. At "s" a
#   2,000-pod list decoded 28% slower into k8s-openapi types and 85% slower
#   into serde_json::Value.
# The three give back 8.4 MiB of the 26 that "s" saves (1.6 of 4.0 under
# xz -9). Before moving a crate in or out, run those budgets at both settings.
[profile.release.package.srelens-registry]
opt-level = 3

[profile.release.package.srelens-plugin-host]
opt-level = 3

[profile.release.package.srelens-kube]
opt-level = 3
