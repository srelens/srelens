ShortDescription: Kubernetes control room in your terminal, built in Rust with k9s navigation
Description: >-
  srelens-tui is a terminal client for Kubernetes. It browses workloads,
  networking, storage, RBAC and custom resources with live watch updates,
  streams logs, opens exec sessions and port forwards, inspects Helm releases,
  and shows a cluster overview with capacity, node readiness and GPU
  allocation. It reads your existing kubeconfig and talks to the API server
  directly, and it drives the kubectl and helm already on your PATH rather
  than bundling its own.
