name: CI

# Run the test suites on every push/PR to a shared branch so nothing lands red.
#
# `feat/ui-next` is one of those: the new-design migration merges there rather
# than into dev until it lands, and a branch missing from this list gets no CI
# at all — not a red check, no checks, which GitHub reports as mergeable. PR
# #326 was opened against it and sat green with zero checks having run. (#318)
on:
  push:
    branches: [dev, main, feat/ui-next]
  pull_request:
    branches: [dev, main, feat/ui-next]

# Pull requests share a per-ref group and cancel each other: a superseded run
# tests a commit nobody will merge, so killing it saves minutes and loses
# nothing.
#
# Pushes get a group of their OWN, keyed on the commit. Grouping them per-ref
# was what made the badge read "failing" — every merge to dev is a push to the
# same ref, so each one cancelled the run before it, and those merge commits
# were never tested. Turning off cancel-in-progress alone does NOT fix that:
# a group holds one pending run, so a third push still evicts the queued
# second one. Only a unique group per commit lets every merge run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the required frontend check on the development default.
          - name: frontend
            file: .nvmrc
          - name: frontend (Node 24)
            node: '24'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` — `pnpm/action-setup` reads `packageManager` from
      # package.json. One source of truth: a second one here is how local
      # ended up on pnpm 11 while CI ran 9, which silently dropped the CVE
      # overrides from the lockfile on every local install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.file }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing else in CI typechecks (#249): `vite build` strips types with
      # esbuild and Vitest transpiles per file, so a real type error passed
      # every check until it was caught by hand (PR #248, main.tsx). Runs
      # before the build — it is the fastest step and the most likely to fail.
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Unit tests with coverage
        # `pnpm test`, NOT `pnpm -r test`: recursive commands skip the workspace
        # root, and the 85/80/76 floors live in the root vitest.config.ts because
        # they are measured across apps/desktop and packages/core together.
        # Running the packages individually would report green with no gate at all.
        run: pnpm test
      - name: Release workflow tests
        run: node --test .github/scripts/*.test.cjs
      - name: Performance-baseline script tests
        # The size classifier decides which artifacts are compared against
        # which (#31) — a wrong bucket silently publishes a bogus comparison.
        # Pure unit tests: no network, so they run on every PR.
        run: node --test scripts/perf/size-baseline.test.mjs
      - name: Trust signing script tests
        # What scripts/extensions/trust.mjs refuses to sign (#559): a root below its
        # threshold, or a catalog missing its entries, which every host would refuse or
        # publish as empty. Fresh keys, no network.
        run: node --test scripts/extensions/trust.test.mjs

  backend:
    name: backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tauri v2 system libraries needed to compile the desktop crate.
      - name: Install Linux dependencies
        run: |
          # The runner image ships apt repos this build does not use --
          # Chrome and Microsoft -- and `apt-get update` exits 100 when ANY
          # configured source fails, which under `bash -e` takes the step
          # with it. Google served a Packages.gz that did not match its own
          # Release file for hours on 2026-09-09 and red-ed every job here,
          # none of which wants a single package from it. Removing a source
          # list uninstalls nothing, so the preinstalled Chrome stays put.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential
      # No `version:` — `pnpm/action-setup` reads `packageManager` from
      # package.json. One source of truth: a second one here is how local
      # ended up on pnpm 11 while CI ran 9, which silently dropped the CVE
      # overrides from the lockfile on every local install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # tauri-build validates that frontendDist exists at compile time,
      # so build the frontend before compiling the Rust workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Pinned by SHA, so `toolchain` has to be explicit: this action reads the
      # ref it was called by to decide which toolchain to install, and a SHA
      # names no channel.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: llvm-tools-preview
      # Same reason: pinned, so the tool comes from an input rather than the tag.
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: srelens-e2e
      # ONE instrumented run covers everything (#28): the unit suites AND the
      # #[ignore]d kind-bound suites, accumulated into one report. Running
      # the integration suites under coverage is what took the honest number
      # from ~80% to ~86% — the capability e2e executes exactly the closure
      # bodies (actions, metrics, crds, helm, exec, manifest) that no mocked
      # unit test reaches — and merging the old separate kind job in here
      # buys that with one workspace build and one cluster instead of two.
      # The e2e's own coverage assertion ("every registered capability is
      # exercised") still runs, unchanged, as part of the suite itself.
      - name: Tests with coverage — unit suites and kind-bound suites
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
          # Authenticates the toolbox suite's api.github.com lookups — the
          # anonymous runner pool 403s intermittently (krew/helm "latest").
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo llvm-cov --no-report --workspace
          cargo llvm-cov --no-report -p srelens-desktop --test e2e -- --ignored --nocapture --test-threads=1
          cargo llvm-cov --no-report -p srelens-kube --test helm_lifecycle -- --ignored --nocapture --test-threads=1
      - name: Enforce the coverage floor
        # Only the process entries stay excluded (the desktop app's lib.rs and
        # main.rs, the server's bin, and the TUI's main.rs — they execute solely
        # inside a running app, server or terminal). Everything else in
        # apps/tui counts: its views render through ratatui's TestBackend and
        # its App runs without a cluster, so there is no excuse there.
        # The command shims that used to sit here are unit-tested through
        # tauri::test's MockRuntime and count like everything else. The floor
        # is a ratchet — 55 at first green, 84 when the kind suites started
        # counting, 85 with the vault-password seams (measured 86.16, issue
        # #28's acceptance number) — never lower it.
        run: >-
          cargo llvm-cov report --summary-only --fail-under-lines 85
          --ignore-filename-regex 'apps/desktop/src-tauri/src/(lib|main)\.rs|crates/server/src/bin/|apps/tui/src/main[.]rs'

  # The extension platform's performance budgets (#581), measured where the
  # roadmap's targets mean something and published so they can be tracked.
  #
  # The same tests already run in `frontend` and `backend`, and hold every
  # count and a generous time ceiling there. But `backend` is a debug build
  # under coverage instrumentation, several times slower than what the
  # targets describe (a broker call's own overhead with 50 apps installed:
  # ~30 ms debug, ~5 ms release on one developer machine), so its timings say
  # little. This job runs the host suite again as a release build and the
  # client suite in Vitest, both without coverage (the client's figures are
  # Node with jsdom, not a production bundle in the WebView), checks that each
  # wrote reports, and uploads one JSON file per measurement: the median, the
  # spread, the target and whether it was met. It needs no cluster and no
  # system libraries — the registry crate is Tauri-free.
  #
  # Informational: nothing here is a required check (dev has none), and a
  # time over its target is reported, not failed. It fails only on a broken
  # count or a time past its ceiling, as the other jobs would.
  extension-budgets:
    name: extension budgets (release)
    runs-on: ubuntu-22.04
    # Reads the checkout and nothing else; uploading an artifact needs no scope.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` — `pnpm/action-setup` reads `packageManager` from
      # package.json, as in the jobs above.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Host budgets, release build
        env:
          SRELENS_PERF_REPORT_DIR: ${{ runner.temp }}/extension-budgets
        # One thread: the timed sections already take turns, and so the
        # fifty-app installs that set them up do not compete with them either.
        run: cargo test --release -p srelens-registry --lib budget_tests -- --test-threads=1 --nocapture
      - name: Client budgets, without coverage
        if: ${{ !cancelled() }}
        env:
          SRELENS_PERF_REPORT_DIR: ${{ runner.temp }}/extension-budgets
        run: pnpm exec vitest run packages/ui-next/src/extensions/extensionBudgets.test.tsx
      - name: Check both suites reported
        if: ${{ !cancelled() }}
        # A test filter that matches nothing passes having measured nothing:
        # renaming `budget_tests` would leave the host step green and empty.
        # Each suite must have written at least one report.
        env:
          REPORTS: ${{ runner.temp }}/extension-budgets
        run: |
          for suite in rust ts; do
            if ! ls "$REPORTS/$suite"-*.json >/dev/null 2>&1; then
              echo "::error::No $suite-*.json budget report was written; did a test filter stop matching?"
              exit 1
            fi
          done
          ls "$REPORTS"
      - name: Upload the budget reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-budgets
          path: ${{ runner.temp }}/extension-budgets
          if-no-files-found: error

  # The Go sidecar SDK (sdk/go) and its example. The generated protocol file
  # must be what the committed schema generates, the code gofmt'd and vetted,
  # and the tests must pass under the race detector (which needs cgo, so it
  # runs here and not on a Windows machine without a C compiler). The
  # example's end-to-end runs are in sandbox-conformance, which has the
  # supervisor and the sandbox.
  go:
    name: go sdk
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: |
            sdk/go/go.sum
            sdk/examples/hello-world/go/go.sum
      - name: The generated protocol file is current
        working-directory: sdk/go
        run: |
          go generate ./...
          git diff --exit-code
      - name: Format and vet
        run: |
          for module in sdk/go sdk/examples/hello-world/go; do
            unformatted=$(cd "$module" && gofmt -l .)
            if [ -n "$unformatted" ]; then
              echo "::error::gofmt would change, in $module: $unformatted"
              exit 1
            fi
            (cd "$module" && go vet ./...)
          done
      - name: Tests, with the race detector
        run: |
          (cd sdk/go && go test -race -cover ./...)
          (cd sdk/examples/hello-world/go && go test -race ./...)

  # The sidecar sandbox conformance suite (#572): the #571 spike's seven
  # checks, and two for what it left open (the host's environment, Unix
  # sockets), run against the production sandbox backend through the real
  # supervisor and launcher (crates/plugin-host/tests/sandbox_conformance.rs).
  # Those tests are #[ignore]d everywhere else: they need an OS sandbox, a
  # network for their positive controls and, on Linux, a delegated cgroup,
  # which this job makes. It is also the only place the Windows backend is
  # compiled at all, so the other sidecar suites run on Windows here too.
  #
  # Not macOS: GitHub's macOS runners are older than macOS 27, the one version
  # the Seatbelt profile was verified on, and srelens refuses sidecars on
  # macOS until its watchdog has been checked on a macOS 27 Mac (#713). The
  # suite runs there by hand, and its header says how; `macos-watchdog` below
  # runs the watchdog itself, without Seatbelt.
  sandbox-conformance:
    name: sandbox conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: |
            sdk/go/go.sum
            sdk/examples/hello-world/go/go.sum
      - name: Build the suites
        run: cargo test -p srelens-plugin-host -p srelens-sidecar-hello-world --no-run
      # The Rust SDK as a sidecar author builds it: the protocol crate without
      # its `schema` feature. The feature is on only for builds with test
      # targets (`cargo test`, `clippy --all-targets`, `llvm-cov`), which take
      # it from the tests' dev-dependencies. This step builds the SDK crates
      # and the example with it off, and denies warnings in the protocol lib
      # with it off, so an item only the schema reads cannot be left ungated.
      # The tree check (`dependencies.rs`, no schemars in what an author
      # builds) runs in `backend` and in the Windows step below.
      - name: The Rust SDK without the schema feature
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p srelens-sidecar -p srelens-sidecar-hello-world
          cargo rustc --locked -p srelens-sidecar-protocol --lib -- -D warnings
      - name: Build the Go example
        shell: bash
        run: go build -C sdk/examples/hello-world/go -o "../../../../target/hello-world-go${{ runner.os == 'Windows' && '.exe' || '' }}" .
      # A cgroup v2 subtree the runner's user owns, with the memory and cpu
      # controllers enabled for its children: what a systemd desktop would
      # delegate to srelens (a user scope with Delegate=yes). cgroup v2 lets a
      # process move another only between cgroups under one it may write, so
      # the test run itself goes into a leaf of the subtree (the next step),
      # and each sidecar's launcher moves itself into a sibling.
      - name: Delegate a cgroup
        if: runner.os == 'Linux'
        run: |
          uname -r
          sudo mkdir -p /sys/fs/cgroup/srelens-ci/host
          sudo chown -R "$(id -u):$(id -g)" /sys/fs/cgroup/srelens-ci
          for controller in memory cpu; do
            grep -qw "$controller" /sys/fs/cgroup/cgroup.subtree_control \
              || echo "+$controller" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          done
      - name: Conformance
        if: runner.os == 'Linux'
        env:
          SRELENS_SANDBOX_CGROUP_ROOT: /sys/fs/cgroup/srelens-ci
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/srelens-ci/host/cgroup.procs
          echo "+memory +cpu" > /sys/fs/cgroup/srelens-ci/cgroup.subtree_control
          cargo test -p srelens-plugin-host --test sandbox_conformance -- --ignored --test-threads=1 --nocapture
          SRELENS_SANDBOX_LAUNCHER="$PWD/target/debug/srelens-sandbox-launch" \
          SRELENS_HELLO_WORLD_GO="$PWD/target/hello-world-go" \
            cargo test -p srelens-sidecar-hello-world --test sandboxed --test supervised -- --ignored --test-threads=1 --nocapture
      # One thread, and the AppContainer profile's cleanup is the test that
      # sorts last.
      - name: Conformance
        if: runner.os == 'Windows'
        run: cargo test -p srelens-plugin-host --test sandbox_conformance -- --ignored --test-threads=1 --nocapture
      # The Rust and Go examples, unconfined and in the AppContainer: every
      # ignored case of both suites.
      - name: The SDK examples, unconfined and in the sandbox
        if: runner.os == 'Windows'
        run: |
          $env:SRELENS_HELLO_WORLD_GO = "$PWD\target\hello-world-go.exe"
          cargo test -p srelens-sidecar-hello-world --test sandboxed --test supervised -- --ignored --test-threads=1 --nocapture
      # bash, not the default PowerShell, which fails a step only on its last
      # command's exit status.
      - name: The other sidecar suites
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p srelens-plugin-host --lib sidecar
          cargo test -p srelens-plugin-host --test sidecar --test sidecar_process
          cargo test -p srelens-sidecar -p srelens-sidecar-hello-world
      # Not a sidecar suite: the one Windows runner is here. Kubeconfig exec
      # plugins must start without a console window, or a release build of
      # the desktop opens one per token fetch (#775). The test pins that the
      # variable the desktop sets is the one kube-rs reads; Linux skips it.
      - name: Exec plugins start without a console window
        if: runner.os == 'Windows'
        run: cargo test -p srelens-kube --test exec_plugin_console

  # The macOS memory and CPU watchdog (#713) on a real process. It does not
  # depend on Seatbelt, so it runs on the runners' older macOS: its policy
  # and its loop, and tests/macos_watchdog.rs, which holds the probe to
  # 128 MiB and 0.25 CPUs and prints how far a hold overshot. It also builds
  # the conformance suite, whose checks 5 and 6 run with Seatbelt by hand on a
  # macOS 27 Mac before macOS runs sidecars.
  macos-watchdog:
    name: macOS watchdog
    runs-on: macos-latest
    # A hang stops here, not at the 6-hour default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # It only builds and runs tests, so the token need not stay in
      # .git/config while the repository's code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # One thread for the integration test, so its other tests (the 512 MiB
      # hold, the memory reading) do not compete with the CPU test for the
      # runner's cores. The CPU test's control and its throttled burn already
      # run one after the other.
      - name: The watchdog
        run: |
          sw_vers
          cargo test -p srelens-plugin-host --test sandbox_conformance --no-run
          cargo test -p srelens-plugin-host --lib sidecar::sandbox
          cargo test -p srelens-plugin-host --test macos_watchdog -- --test-threads=1 --nocapture

  # The WebDriver smoke suite (issue #30): the REAL built app — WebView and
  # all — driven through tauri-driver against a kind cluster. This is the
  # only job that crosses the WebView↔Rust bridge itself, so a regression in
  # the transport shim or command registration fails HERE even when every
  # other suite stays green. Fast subset on PRs; the release workflow runs
  # the full tier (exec + port-forward) with SRELENS_SMOKE_FULL=1.
  smoke:
    name: smoke (webdriver)
    # PRs only: the push rerun after a merge would duplicate the exact gate
    # the PR already passed, at ~8 minutes a pop.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        run: |
          # Third-party repos the runner image ships, dropped for the reason
          # in the backend job above: an outage in one of them fails
          # `apt-get update` for everyone, and this build uses none of them.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.* \
                     /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            webkit2gtk-driver \
            xvfb
      # No `version:` — `pnpm/action-setup` reads `packageManager` from
      # package.json. One source of truth: a second one here is how local
      # ended up on pnpm 11 while CI ran 9, which silently dropped the CVE
      # overrides from the lockfile on every local install.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # custom-protocol makes the debug binary serve the EMBEDDED frontend
      # dist; without it the WebView tries the Vite dev server and the whole
      # window is just "Could not connect to localhost" (first live run's
      # failure screenshot).
      - name: Build the app binary
        run: cargo build -p srelens-desktop --features custom-protocol --profile ci-smoke
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: srelens-e2e
      - name: Smoke suite through the real app
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
          SRELENS_SMOKE_APP: ${{ github.workspace }}/target/ci-smoke/srelens
          SRELENS_SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke-artifacts
        run: |
          xvfb-run --auto-servernum \
            cargo test -p srelens-desktop --features custom-protocol --profile ci-smoke --test webdriver_smoke -- --ignored --nocapture
      - name: Upload failure artifacts (screenshot + app logs)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-failure-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore

  install-script:
    name: install script
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # An install script is the easiest file in the repository to leave
      # broken: nothing builds it, nothing imports it, and the first person to
      # notice is a stranger following the README. `sh` on this runner is
      # dash, which is the point -- the script promises POSIX sh, and bash
      # would happily accept bashisms that Debian and Alpine users would not.
      - name: Lint
        run: shellcheck -s sh packaging/install/install.sh packaging/install/test.sh
      - name: Test
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sh packaging/install/test.sh
      # Again as root, in a container, because six of the cases skip
      # otherwise -- and they are the six that matter most. Every rule about
      # who owns the destination needs a second account and a second group to
      # mean anything, so on an unprivileged runner the ownership walk, the
      # ACL refusal and the group-membership lookup all report `skip` and the
      # job goes green having proven none of them. The suite removes the
      # account and group it creates; the container is thrown away regardless.
      - name: Test as root
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -i \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -v "$PWD/packaging/install:/packaging/install:ro" \
            debian:bookworm-slim sh -c '
              set -e
              apt-get -qq update >/dev/null
              # acl for the ACL case, libdigest-sha-perl for shasum -- without
              # it the sha256sum-absent branch skips here too.
              apt-get -qq install -y curl ca-certificates acl attr libcap2-bin libdigest-sha-perl >/dev/null
              # The suite writes nothing into the mount, but it does need to
              # be able to run from somewhere it owns.
              cp -r /packaging/install /tmp/install
              sh /tmp/install/test.sh
            '

  packaging:
    name: packaging renderers
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The renderer builds every manifest submitted to winget-pkgs, and a
      # wrong hash there fails on a stranger's machine at install time --
      # after moderation has approved it, with nothing pointing back here.
      # The tests pass `--sums`, so they need no release and no network.
      - name: Test the winget renderer
        run: node --test packaging/winget/render.test.mjs

  docker:
    name: docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Until now nothing but the release workflow ever built this file, and
      # two dev releases shipped no container image before anyone noticed. Two
      # separate breaks were waiting in it, one per stage: a pnpm version the
      # lockfile had outgrown, and a workspace member the backend stage never
      # copied. Building only the frontend stage here would have caught one of
      # them.
      #
      # So the whole image, which makes this the slowest job in CI on any
      # change to crates/. That is the price of the image being built at all
      # before a release depends on it. The layer cache carries the Rust stage
      # across runs that do not touch it.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha,scope=docker-ci
          cache-to: type=gha,mode=max,scope=docker-ci
