name: CI

# Run the test suites on every push/PR to dev or main so nothing lands red.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Unit tests with coverage
        # Vitest enforces the 85% line-coverage floor (vitest.config.ts).
        run: pnpm -r test

  backend:
    name: backend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 system libraries needed to compile the desktop crate.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tauri-build validates that frontendDist exists at compile time,
      # so build the frontend before compiling the Rust workspace.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Backend tests with coverage
        # The Tauri runtime shell (commands, event streams, process entry) only
        # executes inside a running app/cluster, so it is excluded from the
        # measurement. The floor is a ratchet: currently 55%, raise it toward
        # 85% as cluster-bound integration tests land — never lower it.
        run: >-
          cargo llvm-cov --workspace --summary-only --fail-under-lines 55
          --ignore-filename-regex 'apps/desktop/src-tauri/src/(lib|main|bridge|exec|files|forward|logs|watch)\.rs'

  integration:
    name: integration (kind)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 system libraries needed to compile the desktop crate.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tauri-build validates that frontendDist exists at compile time, so the
      # frontend must be built before the Rust workspace compiles.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: srelens-e2e
      # These suites are #[ignore]d (they need a live cluster), so they must be
      # run explicitly with --ignored. Without this job the e2e coverage
      # assertion — "every registered capability is exercised end-to-end" —
      # would never execute, and a new capability could land with no e2e case.
      - name: Capability suite against the cluster
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
        run: |
          cargo test -p srelens-desktop --test e2e -- --ignored --nocapture --test-threads=1
      - name: Helm lifecycle against the cluster
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
        run: |
          cargo test -p srelens-kube --test helm_lifecycle -- --ignored --nocapture --test-threads=1

  # The WebDriver smoke suite (issue #30): the REAL built app — WebView and
  # all — driven through tauri-driver against a kind cluster. This is the
  # only job that crosses the WebView↔Rust bridge itself, so a regression in
  # the transport shim or command registration fails HERE even when every
  # other suite stays green. Fast subset on PRs; the release workflow runs
  # the full tier (exec + port-forward) with SRELENS_SMOKE_FULL=1.
  smoke:
    name: smoke (webdriver)
    # PRs only: the push rerun after a merge would duplicate the exact gate
    # the PR already passed, at ~8 minutes a pop.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            webkit2gtk-driver \
            xvfb
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # custom-protocol makes the debug binary serve the EMBEDDED frontend
      # dist; without it the WebView tries the Vite dev server and the whole
      # window is just "Could not connect to localhost" (first live run's
      # failure screenshot).
      - name: Build the app binary
        run: cargo build -p srelens-desktop --features custom-protocol --profile ci-smoke
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: srelens-e2e
      - name: Smoke suite through the real app
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
          SRELENS_SMOKE_APP: ${{ github.workspace }}/target/ci-smoke/srelens
          SRELENS_SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke-artifacts
        run: |
          xvfb-run --auto-servernum \
            cargo test -p srelens-desktop --features custom-protocol --profile ci-smoke --test webdriver_smoke -- --ignored --nocapture
      - name: Upload failure artifacts (screenshot + app logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
