name: Release

# dev  branch  -> rolling pre-release tagged `srelens-v<version>-<run>`. NOT built
#                 on every push: a dev release is cut once a day (see the cron
#                 below) or on demand via "Run workflow". If nothing has landed
#                 since the last dev pre-release the run skips the build, so we
#                 don't burn an Apple notarization request on an identical
#                 binary. A manual run can override that with `force`.
# main branch  -> the version is derived AUTOMATICALLY from Conventional Commits
#                 since the last stable tag (feat -> minor, fix/perf -> patch,
#                 BREAKING CHANGE or `!` -> major). The version files are bumped +
#                 committed back to main with [skip ci], then a stable
#                 `srelens-v<version>` release is built. No manual bump needed; if
#                 there are no releasable commits the release is skipped.
on:
  push:
    branches: [main]
  # Once-a-day dev pre-release at 18:00 UTC. Scheduled runs always use the
  # default branch (dev). Skipped automatically when nothing has landed since
  # the last dev pre-release.
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if nothing changed since the last dev pre-release'
        type: boolean
        default: false

# Don't cancel an in-flight release run (it could leave partial assets).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Auto-versioning (main only): compute the next semver from Conventional
  # Commits, bump the version files, and commit the bump back to main ([skip ci]
  # so it doesn't re-trigger). Outputs the new version + whether to release.
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.compute.outputs.version }}
      release: ${{ steps.compute.outputs.release }}
      notes: ${{ steps.compute.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compute + commit next version
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          # Dev branch: derive a monotonic pre-release version that sorts ABOVE the
          # current stable (semver prereleases sort below their release, so we bump
          # the patch first): 0.1.0 -> 0.1.1-<run>. The prerelease identifier must be
          # numeric-only (and <= 65535) so the Windows MSI target accepts it, so we
          # use the run number alone. Not committed; the build job writes it into
          # the version files locally before building.
          if [ "${{ github.ref_name }}" != "main" ]; then
            # Nothing new since the last dev pre-release? Skip — rebuilding the
            # same tree yields an identical app and costs an Apple notarization
            # request, which is what we're economizing. `force` (manual runs
            # only) overrides; inputs.force is empty on schedule/push events, so
            # the check applies there.
            LAST_DEV_TAG=$(git for-each-ref --sort=-creatordate --format='%(refname:short)' 'refs/tags/srelens-v*' \
              | grep -vE '^srelens-v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ "${{ inputs.force }}" != "true" ] && [ -n "$LAST_DEV_TAG" ]; then
              LAST_SHA=$(git rev-list -n 1 "$LAST_DEV_TAG" 2>/dev/null || true)
              if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$(git rev-parse HEAD)" ]; then
                echo "release=false" >> "$GITHUB_OUTPUT"
                echo "No new commits since ${LAST_DEV_TAG} — skipping dev release."
                exit 0
              fi
              echo "Changes since ${LAST_DEV_TAG}:"
              git log --oneline "${LAST_DEV_TAG}..HEAD" || true
            fi
            CUR=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
            BASE=${CUR%%-*}
            NEXT=$(node -e 'const p=process.argv[1].split(".").map(Number);p[2]++;process.stdout.write(p.join("."))' "$BASE")
            DEVV="${NEXT}-${GITHUB_RUN_NUMBER}"
            echo "version=$DEVV" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Dev build version: $DEVV"
            exit 0
          fi
          # Latest STABLE tag only (srelens-vX.Y.Z with no prerelease suffix).
          LAST_TAG=$(git tag --list 'srelens-v*' | grep -E '^srelens-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          RANGE=""
          [ -n "$LAST_TAG" ] && RANGE="${LAST_TAG}..HEAD"
          SUBJECTS=$(git log --no-merges --pretty=%B ${RANGE})
          # Each pattern also accepts a leading "* " so a SQUASH-merged
          # dev→main promotion still releases: GitHub's default squash message
          # lists the squashed commits as "* <subject>" bullets in the body,
          # and without this the only commit in range would be the
          # non-conventional "release: ..." subject itself — BUMP=none, and
          # the entire release (desktop, docker, AUR) silently skips. The
          # documented path is still a plain merge commit; this is the
          # backstop for the wrong button.
          if echo "$SUBJECTS" | grep -qiE '(^|[[:space:]])BREAKING[ -]CHANGE' \
             || echo "$SUBJECTS" | grep -qE '^(\* )?[a-z]+(\([^)]*\))?!:'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -qE '^(\* )?feat(\([^)]*\))?:'; then
            BUMP=minor
          elif echo "$SUBJECTS" | grep -qE '^(\* )?(fix|perf)(\([^)]*\))?:'; then
            BUMP=patch
          else
            BUMP=none
          fi
          echo "Detected bump since ${LAST_TAG:-<start>}: $BUMP"
          if [ "$BUMP" = "none" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable (feat/fix/perf/breaking) commits — skipping release."
            exit 0
          fi
          CUR=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          NEW=$(node -e 'const p=process.argv[1].split(".").map(Number);const k=process.argv[2];if(k==="major"){p[0]++;p[1]=0;p[2]=0}else if(k==="minor"){p[1]++;p[2]=0}else{p[2]++}process.stdout.write(p.join("."))' "$CUR" "$BUMP")
          echo "Releasing $CUR -> $NEW"
          node -e '
            const fs=require("fs");const v=process.argv[1];
            const sub=(p,re,to)=>{const s=fs.readFileSync(p,"utf8");const n=s.replace(re,to);if(n===s)throw new Error("no version match in "+p);fs.writeFileSync(p,n)};
            sub("apps/desktop/src-tauri/tauri.conf.json",/("version":\s*)"[^"]+"/,`$1"${v}"`);
            // Every crate inherits [workspace.package].version from the root
            // Cargo.toml (src-tauri included), so ONE Cargo bump versions the
            // whole workspace — the server binary, the MCP serverInfo, all of
            // it — and the lock updates every srelens-* member to match.
            sub("Cargo.toml",/^version = "[^"]+"/m,`version = "${v}"`);
            sub("Cargo.lock",/(name = "srelens-[a-z-]+"\r?\nversion = ")[^"]+(")/g,`$1${v}$2`);
          ' "$NEW"
          # Grouped changelog for the release body. The Conventional Commit type
          # is dropped (the section heading already says Features / Fixes) but
          # the SCOPE is kept as a bold lead-in: without it, subjects written to
          # follow a scope read as context-free fragments in the release notes
          # and the in-app updater — "full action coverage, capability audit,
          # and smarter ranking" tells a user nothing that "**palette:** ..."
          # does. Line 1 handles scoped commits, line 2 unscoped ones.
          strip='s/^[a-z]+\(([^)]*)\)!?:[[:space:]]*/**\1:** /; s/^[a-z]+!?:[[:space:]]*//'
          # Subjects, plus "* <subject>" bullets from commit BODIES — the shape
          # GitHub's squash merge records the squashed commits in. Without the
          # bullets, a squash-merged promotion (whose only subject is the
          # non-conventional "release: ..." title) would pass the bump gate
          # above but publish a release with EMPTY notes. Plain body prose
          # stays excluded: only "* "-bulleted, type-prefixed lines qualify.
          SOURCES=$( { git log --no-merges --pretty=%s ${RANGE}; \
                       git log --no-merges --pretty=%b ${RANGE} | sed -nE 's/^\* ([a-z]+(\([^)]*\))?!?:.*)$/\1/p'; } )
          FEATS=$(echo "$SOURCES" | grep -E '^feat' | sed -E "$strip" | sed 's/^/- /' || true)
          FIXES=$(echo "$SOURCES" | grep -E '^(fix|perf)' | sed -E "$strip" | sed 's/^/- /' || true)
          {
            echo "notes<<__NOTES_EOF__"
            [ -n "$FEATS" ] && printf '### Features\n%s\n\n' "$FEATS"
            [ -n "$FIXES" ] && printf '### Fixes\n%s\n\n' "$FIXES"
            echo "__NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "chore(release): srelens-v${NEW} [skip ci]"
          git push origin HEAD:main
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Publish the srelens web image to GHCR (multi-arch) whenever the version
  # job determined there's something to release — mirrors the desktop build's
  # release gate, independent of the (long) desktop matrix below.
  #
  # ONE ARCHITECTURE PER NATIVE RUNNER, joined into a manifest by the job below.
  # This used to be a single job building linux/amd64,linux/arm64 with QEMU, but
  # the image compiles the server from source (see Dockerfile) and emulating a
  # Rust release build is punishing: the last such run took 1h44m, against ~12
  # minutes for all four desktop targets including Apple notarization. Worse, it
  # serialized releases — `concurrency: release-<ref>` meant the next stable cut
  # sat pending behind it. arm64 runners are free for public repos, so the arm
  # leg now compiles natively instead of instruction-by-instruction.
  #
  # Each leg pushes by DIGEST only (no tag): two jobs pushing the same tag would
  # race, with the loser's architecture silently dropped from the result.

  # Full-tier WebDriver smoke (issue #30): the fast subset gates every PR in
  # ci.yml; stable releases additionally run the full path — exec into the
  # fixture pod and a real port-forward round-trip — against the built app.
  # Runs only for main (stable) releases; dev pre-releases rely on the PR
  # gate. A failure fails the workflow run loudly; the desktop build matrix
  # is deliberately not serialized behind this (~15 min) job, so it is the
  # red X on the release run, not a publish blocker.
  smoke-full:
    name: smoke (webdriver, full)
    needs: version
    if: needs.version.outputs.release == 'true' && github.ref_name == 'main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            webkit2gtk-driver \
            xvfb
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # custom-protocol makes the debug binary serve the EMBEDDED frontend
      # dist; without it the WebView tries the Vite dev server and the whole
      # window is just "Could not connect to localhost" (first live run's
      # failure screenshot).
      - name: Build the app binary
        run: cargo build -p srelens-desktop --features custom-protocol --profile ci-smoke
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: srelens-e2e
      - name: Full smoke suite through the real app
        env:
          SRELENS_E2E_CONTEXT: kind-srelens-e2e
          SRELENS_SMOKE_FULL: "1"
          SRELENS_SMOKE_APP: ${{ github.workspace }}/target/ci-smoke/srelens
          SRELENS_SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke-artifacts
        run: |
          xvfb-run --auto-servernum \
            cargo test -p srelens-desktop --features custom-protocol --profile ci-smoke --test webdriver_smoke -- --ignored --nocapture
      - name: Upload failure artifacts (screenshot + app logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-full-failure-artifacts
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore

  docker:
    name: docker image (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Stamp the release version into the workspace before the image builds:
      # every crate inherits [workspace.package].version, and without this the
      # server binary in the image reports the committed placeholder instead
      # of the released version — on main this job checks out the pre-bump
      # push sha (the version job's bump commit lands after), and on dev the
      # pre-release version is never committed at all.
      - name: Set build version
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e '
            const fs=require("fs");const v=process.argv[1];
            const sub=(p,re,to)=>{const s=fs.readFileSync(p,"utf8");if(!re.test(s))throw new Error("no version field in "+p);fs.writeFileSync(p,s.replace(re,to))};
            sub("Cargo.toml",/^version = "[^"]+"/m,`version = "${v}"`);
            sub("Cargo.lock",/(name = "srelens-[a-z-]+"\r?\nversion = ")[^"]+(")/g,`$1${v}$2`);
          ' "$V"
          echo "Docker build version: $V"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/srelens/srelens,push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope: a shared scope would have the two legs
          # overwrite each other's layers on every run, costing the cache hit
          # this is meant to provide.
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::build produced no digest for ${{ matrix.arch }}"
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: docker-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Join the per-arch images into one multi-arch tag. Split from the build jobs
  # so the tag appears only once BOTH architectures are published — a partial
  # manifest would serve amd64 users an image while arm64 pulls 404.
  docker-manifest:
    name: docker manifest
    needs: [version, docker]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          IMAGE=ghcr.io/srelens/srelens
          TAGS=(-t "${IMAGE}:${VERSION}")
          # `latest` only for stable releases on main.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS+=(-t "${IMAGE}:latest")
          fi
          cd /tmp/digests
          # Both legs must have landed; an empty or short list means a silent
          # partial publish, which is exactly what this job exists to prevent.
          count=$(ls -1 | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 per-arch digests, found ${count}"
            ls -la
            exit 1
          fi
          docker buildx imagetools create "${TAGS[@]}" $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  build:
    needs: version
    # Run only when the version job decided to release. On main that's when
    # there are releasable commits; on dev that's a scheduled/manual run with
    # new commits since the last dev pre-release (or a forced run).
    if: ${{ always() && needs.version.result == 'success' && needs.version.outputs.release == 'true' }}
    permissions:
      contents: write
    env:
      # macOS signing + notarization switch on automatically once the FULL
      # Apple secret set is present; with anything less the build stays
      # unsigned rather than failing on a partial configuration.
      ENABLE_MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' }}
      # Libraries the AppImage must NOT bundle (#111) — see the seed step below.
      # Single source of truth: the build passes this to linuxdeploy, and the
      # post-build assert greps for the same pattern. Keep them in lockstep.
      APPIMAGE_EXCLUDED_LIBS: "libwayland-*"
      # Immutable linuxdeploy release (NOT the rolling `continuous` tag, whose
      # asset is rebuilt by a monthly upstream cron and would break this pin —
      # and every release with it — without a single upstream commit).
      #
      # Bumping this adopts upstream's baked-in excludelist wholesale, which can
      # silently stop bundling libraries beyond the ones named here (it already
      # covers libwayland-client and libpipewire-0.3). Diff that list before
      # moving the pin; the assert below only guards the Wayland case.
      LINUXDEPLOY_RELEASE: "1-alpha-20251107-1"
      LINUXDEPLOY_SHA256: "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Apple Silicon
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04      # Linux
            target: ''
            args: ''
          - platform: windows-latest    # Windows
            target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On main, the version job already pushed the bump commit — build it.
          ref: ${{ github.ref_name == 'main' && 'main' || github.sha }}

      # Tauri v2 build dependencies.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev \
            build-essential \
            curl wget file

      # The AppImage must NOT bundle libwayland-*: they're part of the platform
      # ABI (they must match the host compositor/Mesa), and shipping the build
      # machine's copies makes eglGetDisplay() fail with EGL_BAD_PARAMETER on
      # any host with a newer Mesa — a blank window on launch (#111). The libs
      # then come from the host, which every GTK-capable desktop already has
      # (libgdk-3/libwebkit2gtk link them directly); the AppImage community
      # excludelist treats libwayland-client the same way.
      #
      # tauri-bundler passes no exclude flags to linuxdeploy, but linuxdeploy
      # reads exclude globs from $LINUXDEPLOY_EXCLUDED_LIBRARIES — added
      # upstream in 2025-08, newer than the 2024-07 linuxdeploy tauri-bundler
      # mirrors. The bundler skips its own download when the tools cache is
      # already populated (it checks existence only, no checksum), so seed the
      # cache with a pinned immutable release.
      #
      # If a future tauri-bundler changes that cache path or filename, the seed
      # is silently ignored, the old linuxdeploy runs, and the assert step below
      # fails the build — loudly, before anything is published. The documented
      # escape hatch is TAURI_BUNDLER_TOOLS_GITHUB_MIRROR_TEMPLATE, which
      # redirects the bundler's own tool downloads (it would then also need to
      # serve AppRun-<arch>). Remove this step entirely once tauri-bundler
      # mirrors a linuxdeploy >= 2025-08 or exposes an exclusion config.
      - name: Seed linuxdeploy that honors Wayland lib exclusion (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL --retry 3 --retry-all-errors -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_RELEASE}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Write the resolved version into the bundle version files so the built
      # app carries it. On main the version job already committed this value
      # (idempotent here); on dev it's <next>-<run>.
      - name: Set build version
        shell: bash
        run: |
          V="${{ needs.version.outputs.version }}"
          node -e '
            const fs=require("fs");const v=process.argv[1];
            const sub=(p,re,to)=>{const s=fs.readFileSync(p,"utf8");if(!re.test(s))throw new Error("no version field in "+p);fs.writeFileSync(p,s.replace(re,to))};
            sub("apps/desktop/src-tauri/tauri.conf.json",/("version":\s*)"[^"]+"/,`$1"${v}"`);
            sub("Cargo.toml",/^version = "[^"]+"/m,`version = "${v}"`);
            sub("Cargo.lock",/(name = "srelens-[a-z-]+"\r?\nversion = ")[^"]+(")/g,`$1${v}$2`);
          ' "$V"
          echo "Built version: $V"

      # Export the Apple signing env ONLY when the full secret set exists.
      # Tauri treats a *defined but empty* APPLE_CERTIFICATE as "please sign"
      # and then fails importing the empty cert — so these variables must be
      # absent (not empty) on unsigned builds.
      - name: Enable macOS signing (when secrets are configured)
        if: matrix.platform == 'macos-latest' && env.ENABLE_MAC_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE<<__EOF__";          echo "${{ secrets.APPLE_CERTIFICATE }}";          echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD<<__EOF__"; echo "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"; echo "__EOF__"
            echo "APPLE_SIGNING_IDENTITY<<__EOF__";     echo "${{ secrets.APPLE_SIGNING_IDENTITY }}";     echo "__EOF__"
            echo "APPLE_API_ISSUER<<__EOF__";           echo "${{ secrets.APPLE_API_ISSUER }}";           echo "__EOF__"
            echo "APPLE_API_KEY<<__EOF__";              echo "${{ secrets.APPLE_API_KEY }}";              echo "__EOF__"
          } >> "$GITHUB_ENV"
          # Notarization uses an App Store Connect API key (.p8) materialized
          # to a file; tauri-action reads APPLE_API_KEY_PATH from there.
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/apple_api_key.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple_api_key.p8" >> "$GITHUB_ENV"

      # Stable -> srelens-v<version>. Dev -> a unique semver pre-release
      # (srelens-vX.Y.Z-<run>) so every dev build gets its own tag.
      - name: Compute release tag
        shell: bash
        run: |
          echo "REL_TAG=srelens-v${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "REL_NAME=srelens v${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Build app & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — produces the .sig files latest.json needs so the
          # in-app updater can verify downloads.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Keep host-ABI Wayland libs out of the AppImage (#111); read by the
          # seeded linuxdeploy, ignored everywhere else.
          LINUXDEPLOY_EXCLUDED_LIBRARIES: ${{ env.APPIMAGE_EXCLUDED_LIBS }}
          # Apple signing env (APPLE_CERTIFICATE etc.) is exported to
          # GITHUB_ENV by the step above only when signing is enabled —
          # defining the variables empty here would trigger Tauri's signing
          # path, which then fails importing an empty certificate.
        with:
          projectPath: apps/desktop
          tagName: ${{ env.REL_TAG }}
          releaseName: ${{ env.REL_NAME }}
          # On main, real notes are computed in the version job; dev keeps a
          # placeholder filled in by the release-notes job.
          releaseBody: ${{ needs.version.outputs.notes || 'Generating release notes…' }}
          prerelease: ${{ github.ref_name != 'main' }}
          # On main, publish as a DRAFT: assets upload here, but a draft never
          # resolves as `releases/latest` — which is exactly where every stable
          # install looks for latest.json. Without this, a leg that fails AFTER
          # uploading (a failed assert, a broken matrix leg) leaves a public
          # release that `latest` points at but that carries no manifest,
          # 404ing the update check for the whole install base. The
          # publish-release job flips the draft once the pipeline is green.
          #
          # Dev stays non-draft: pre-releases are already excluded from
          # `releases/latest`, and the dev-channel manifest published by
          # updater-manifest must point at assets that are live immediately.
          releaseDraft: ${{ github.ref_name == 'main' }}
          args: ${{ matrix.args }}
          # Each matrix job uploads its own binaries + signatures, but NOT
          # latest.json — parallel jobs would race on that single asset. The
          # updater-manifest job assembles it once, after all builds.
          includeUpdaterJson: false

      # Regression tripwire for #111: fail the build if the AppImage bundles
      # host-ABI Wayland libs. The release is still a draft at this point, so
      # failing here keeps a bad AppImage from ever becoming publicly
      # downloadable or reaching the updater.
      - name: Assert AppImage bundles no Wayland libs (Linux)
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          apps=(target/release/bundle/appimage/*.AppImage)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::expected exactly one built AppImage, found ${#apps[@]}: ${apps[*]}"
            exit 1
          fi
          "${apps[0]}" --appimage-extract > /dev/null
          found=$(find squashfs-root -name "$APPIMAGE_EXCLUDED_LIBS")
          if [ -n "$found" ]; then
            echo "::error::AppImage bundles Wayland platform libs — blank window on newer Mesa (#111):"
            echo "$found"
            exit 1
          fi
          echo "OK: no $APPIMAGE_EXCLUDED_LIBS in the AppImage"

  # Dev only: fill the pre-release body with a recent-commit list and keep the
  # Releases page tidy. Stable (main) notes come from the version job.
  release-notes:
    needs: [version, build]
    if: github.ref_name != 'main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose and publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="srelens-v${VERSION}"
          {
            echo "Development pre-release — unstable, not for production."
            echo ""
            echo "**Commit:** \`${{ github.sha }}\`"
            echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "### Recent changes"
            git log -15 --no-merges --pretty='- %s (%h)'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

      # Keep only the 10 newest dev pre-releases (tags like srelens-vX.Y.Z-<run>)
      # and delete the rest + their tags.
      - name: Prune old dev pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName,createdAt,isPrerelease \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("-[0-9]+$")))]
                  | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r t; do
              [ -n "$t" ] && gh release delete "$t" --cleanup-tag --yes
            done

  # Assemble latest.json ONCE from the per-platform .sig files the matrix
  # uploaded, then publish it per channel:
  #   stable (main) -> the release itself, served at releases/latest/download/latest.json
  #   dev           -> the permanent `dev-channel` pre-release, giving dev builds
  #                    a stable manifest URL for this build's assets.
  updater-manifest:
    needs: [version, build]
    if: ${{ always() && needs.build.result == 'success' && (github.ref_name != 'main' || needs.version.outputs.release == 'true') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'main' && 'main' || github.sha }}
      - name: Compose and publish updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          export REL_TAG="srelens-v${VERSION}"
          mkdir -p sigs
          gh release download "$REL_TAG" --repo "$REPO" --pattern '*.sig' --dir sigs --clobber || true
          if ! ls sigs/*.sig >/dev/null 2>&1; then
            echo "No .sig files on $REL_TAG — updater signing key not configured yet; skipping manifest."
            exit 0
          fi
          node .github/scripts/compose-latest.cjs
          if [ "${{ github.ref_name }}" = "main" ]; then
            gh release upload "$REL_TAG" latest.json --repo "$REPO" --clobber
          else
            gh release view dev-channel --repo "$REPO" >/dev/null 2>&1 || \
              gh release create dev-channel --repo "$REPO" --prerelease \
                --title "Dev channel" \
                --notes "Rolling dev-channel updater manifest. Do not delete." \
                --target "$GITHUB_SHA"
            gh release upload dev-channel latest.json --repo "$REPO" --clobber
          fi

  # Download-size baseline (issue #31). Runs after the artifacts are published
  # so it measures exactly what users download, and flags a release whose
  # installers grew more than 15% over the previous stable one — the size
  # advantage over an Electron client is a stated reason for the Tauri port,
  # so a silent regression should not reach a release unnoticed.
  size-baseline:
    needs: [version, build]
    if: ${{ always() && needs.build.result == 'success' && github.ref_name == 'main' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare installer sizes against the previous release
        env:
          # Authenticates the Releases API reads (the anonymous rate limit is
          # low enough for a runner pool to hit it).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Capture the verdict rather than piping it: a `| tee` would mask the
          # check's exit code and a regression would pass silently. The
          # comparison table is still published either way.
          # --tag pins the comparison to the release just built. On main that
          # release is still a DRAFT until publish-release flips it, and drafts
          # are excluded from the stable list — without this the check would
          # compare the two PREVIOUS published releases and never see these
          # artifacts at all.
          status=0
          node scripts/perf/size-baseline.mjs --check-regression --max-growth 15 \
            --tag "srelens-v${{ needs.version.outputs.version }}" > check.txt || status=$?
          {
            echo '### Installer sizes'
            echo
            echo '```'
            cat check.txt
            echo '```'
            echo
            # --tag here too: without it the table would describe the
            # previous PUBLISHED release, not the draft just built.
            node scripts/perf/size-baseline.mjs \
              --tag "srelens-v${{ needs.version.outputs.version }}" || true
          } >> "$GITHUB_STEP_SUMMARY"
          cat check.txt
          exit "$status"

  # Attach detached GPG signatures (.asc) to every release asset so users can
  # verify authenticity (`gpg --verify file.asc file`). Activates automatically
  # once the GPG_PRIVATE_KEY secret is set; otherwise it's a no-op.
  # Signs the assets attached to THIS release's tag. On a stable release that
  # includes latest.json, which updater-manifest uploads to the same tag —
  # hence the dependency below, since both used to run off [version, build] in
  # parallel and whether the manifest got signed came down to which finished
  # first. On a dev pre-release the manifest instead goes to the rolling
  # `dev-channel` release, so it is NOT signed here. That is acceptable because
  # the manifest is not a trust anchor: it lists each installer's URL and .sig,
  # and the updater verifies the installer it downloads against the public key
  # pinned in tauri.conf.json — so tampering with the manifest cannot get a
  # modified build accepted. (The manifest itself carries no signature of its
  # own, on either channel.)
  #
  # Signing is a publication GATE on stable only: publish-release requires this
  # job, so a stable release that fails to sign stays an invisible draft. Dev
  # pre-releases are public the moment they build (releaseDraft is false for
  # dev), so a failure here turns the run red but the assets are already
  # downloadable. That is deliberate — the dev-channel manifest points at those
  # asset URLs, so drafting the release would 404 the updater until a publish
  # step ran, and gating a daily automated pre-release on GPG infrastructure
  # trades availability for a guarantee dev users have not asked for. The docs
  # scope the promise to stable accordingly.
  sign-artifacts:
    needs: [version, build, updater-manifest]
    if: ${{ always() && needs.build.result == 'success' && needs.updater-manifest.result == 'success' && (github.ref_name != 'main' || needs.version.outputs.release == 'true') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      ENABLE_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      # ENABLE_GPG makes signing opt-in, which is right for dev but fail-OPEN
      # for stable: a deleted or renamed secret would skip both steps, report
      # success, and let publish-release ship an unsigned release while the
      # docs promise otherwise. Stable requires the key.
      - name: Require a signing key for stable releases
        if: github.ref_name == 'main' && env.ENABLE_GPG != 'true'
        run: |
          echo "GPG_PRIVATE_KEY is not set, so this stable release cannot be signed." >&2
          echo "Set the secret (docs/DEVELOPMENT.md -> Release signing key) and re-run." >&2
          exit 1
      # The fingerprint printed in docs/INSTALL.md is what a user is told to
      # compare against, so it — not KEYS — is the authoritative statement of
      # which key is current. KEYS is a cumulative archive holding retired keys
      # too, so "the key in KEYS" is not a well-defined thing to check against.
      - uses: actions/checkout@v4
        if: env.ENABLE_GPG == 'true'
        with:
          ref: ${{ github.ref_name == 'main' && 'main' || github.sha }}
      - name: Import GPG key
        if: env.ENABLE_GPG == 'true'
        env:
          # Through the environment rather than interpolated into the script:
          # a secret spliced into the command text is one quoting accident away
          # from being mangled, and it keeps the value out of the shell trace.
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
      # A rotation done in the wrong order — new key published in KEYS, old one
      # still in GPG_PRIVATE_KEY, or the reverse — otherwise signs happily and
      # ships .asc files that no user can verify against the documented
      # fingerprint. The failure is silent at signing time and only surfaces
      # when someone tries to verify a download, so it is caught here instead.
      - name: Check the signing key matches what users are told to expect
        if: env.ENABLE_GPG == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -f KEYS ] || { echo "KEYS is missing — publish the public key first." >&2; exit 1; }

          SIGNING_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          # The install guide lists a fingerprint per key generation so older
          # releases stay verifiable after a rotation; the row marked **current**
          # is the one this release must be signed with.
          # Exactly one row may be marked current. A rotation that adds the new
          # row but forgets to unmark the old one would otherwise let head -1
          # pick the retired fingerprint, match a stale secret, and publish
          # under a key the release range does not point users at.
          CURRENT_ROWS=$(grep -icE '^\|.*\*\*current\*\*.*\|' docs/INSTALL.md || true)
          if [ "$CURRENT_ROWS" -ne 1 ]; then
            echo "docs/INSTALL.md marks $CURRENT_ROWS signing-key rows as **current**;" >&2
            echo "exactly one must be marked. Fix the fingerprint table." >&2
            exit 1
          fi
          DOC_FPR=$(grep -iE '^\|.*\*\*current\*\*.*\|' docs/INSTALL.md \
            | grep -oE '[0-9A-F]{8}( +[0-9A-F]{8}){4}' | tr -d ' ')

          if [ -z "$SIGNING_FPR" ] || [ -z "$DOC_FPR" ]; then
            echo "Could not read a fingerprint (signing='$SIGNING_FPR' docs='$DOC_FPR')." >&2
            exit 1
          fi

          # Catches a rotation that updated the secret but not the docs, or the
          # reverse: users following the guide would reject a good release, or
          # accept one signed by a key the guide never named.
          if [ "$SIGNING_FPR" != "$DOC_FPR" ]; then
            echo "Signing key does not match the fingerprint published to users:" >&2
            echo "  GPG_PRIVATE_KEY:            $SIGNING_FPR" >&2
            echo "  docs/INSTALL.md (current):  $DOC_FPR" >&2
            exit 1
          fi

          # …and that the key is actually IN the archive users import from —
          # anywhere in it, since KEYS also carries retired keys — and that
          # KEYS does not itself say the key is revoked or expired. Presence
          # alone is not enough: a revocation added to KEYS while the secret
          # still holds the un-revoked key would sign and publish happily,
          # while every user importing KEYS gets the revocation warning the
          # install guide tells them to treat as a failure.
          # show-only inspects KEYS without importing it into the keyring.
          VALIDITY=$(gpg --with-colons --import-options show-only --import KEYS \
            | awk -F: -v want="$SIGNING_FPR" '/^pub:/{v=$2} /^fpr:/{if ($10==want) {print v; exit}}')
          if [ -z "$VALIDITY" ]; then
            echo "Signing key $SIGNING_FPR is not published in KEYS," >&2
            echo "so users could not import the key needed to verify it." >&2
            exit 1
          fi
          case "$VALIDITY" in
            r) echo "KEYS marks $SIGNING_FPR as REVOKED — rotate before releasing." >&2; exit 1 ;;
            e) echo "KEYS marks $SIGNING_FPR as EXPIRED — rotate before releasing." >&2; exit 1 ;;
          esac
          echo "Signing key $SIGNING_FPR matches the docs, is published in KEYS, and is usable."
      - name: Sign release assets
        if: env.ENABLE_GPG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="srelens-v${{ needs.version.outputs.version }}"
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          if [ -z "$KEYID" ]; then
            echo "GPG_PRIVATE_KEY is set but no secret key was imported." >&2
            exit 1
          fi
          echo "Signing with key $KEYID"
          mkdir -p _assets && cd _assets
          gh release download "$TAG" --repo "${{ github.repository }}" --clobber
          shopt -s nullglob
          signed=0
          for f in *; do
            # Skip our own output, and the minisign updater signatures — those
            # are verified by the updater's own key, and a .sig.asc is noise on
            # the release page.
            case "$f" in *.asc | *.sig) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --local-user "$KEYID" --armor --detach-sign --output "$f.asc" "$f"
            signed=$((signed + 1))
          done
          # A configured key that signs nothing means the download or the skip
          # rules are wrong; failing here keeps the release a draft rather than
          # publishing one that silently claims to be signed.
          if [ "$signed" -eq 0 ]; then
            echo "No assets were signed — nothing matched on $TAG." >&2
            exit 1
          fi
          echo "Signed $signed asset(s)."
          gh release upload "$TAG" --repo "${{ github.repository }}" *.asc --clobber

  # Stable only (dev never drafts — see releaseDraft above). Flip the draft once
  # the whole pipeline is green: every matrix leg built and passed its asserts,
  # latest.json is attached, and GPG signing (when enabled) is done. A failed
  # run leaves an invisible draft to delete instead of a public, `latest`-
  # resolving release with no manifest behind it.
  publish-release:
    # size-baseline included so an over-budget installer never goes public: a
    # failed check leaves the release as an invisible draft to inspect, exactly
    # like a failed build or a missing updater manifest.
    needs: [version, build, updater-manifest, sign-artifacts, size-baseline]
    if: ${{ always() && github.ref_name == 'main' && needs.build.result == 'success' && needs.updater-manifest.result == 'success' && needs.sign-artifacts.result == 'success' && needs.size-baseline.result == 'success' && needs.version.outputs.release == 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "srelens-v${{ needs.version.outputs.version }}" \
            --repo "${{ github.repository }}" --draft=false

  # Arch / CachyOS / Manjaro install path. Deliberately STABLE-ONLY: AUR users
  # expect released versions, and an Arch `pkgver` cannot carry the `-<run>`
  # suffix that dev pre-release tags use.
  #
  # A -bin package linking the SYSTEM webkit2gtk/gtk3/wayland/mesa also can't hit
  # the bundled-library class of bug that #111 was: releases up to 0.2.1 vendored
  # libwayland-* in the AppImage and opened a blank window on newer Mesa. The
  # build job now excludes those libs and asserts it, so the AppImage is no
  # longer affected either. See packaging/aur/README.md.
  #
  # The steps live in their own reusable workflow so the same publish can be run
  # BY HAND for an already-released version. Welded to this pipeline, a failed
  # AUR push could only be retried by cutting another release — which is how AUR
  # sat at 0.2.0 while four stable releases came and went.
  aur:
    # Also needs publish-release: updpkgsums fetches the release assets over
    # plain HTTPS, which only works once the release is out of draft.
    needs: [version, build, publish-release]
    if: ${{ github.ref_name == 'main' && needs.publish-release.result == 'success' && needs.version.outputs.release == 'true' }}
    uses: ./.github/workflows/aur-publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
