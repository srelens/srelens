name: Extension catalog

# The live catalog and release check (#536). `public_catalog_release_smoke` in
# crates/registry/src/extensions/catalog.rs downloads the public catalog and
# every release manifest it lists, then checks each one as installing it from
# Settings -> Apps would: the catalog checksum, the pinned publisher signature
# for official apps, and this host's manifest rules.
#
# Every other job skips it (`#[ignore]`) because what it tests changes without
# a commit here. A re-uploaded release asset, a signature made with the wrong
# key, or a catalog entry this host can no longer read breaks installs for
# users while every pull request stays green. A daily run finds that first.
on:
  schedule:
    # Daily, off the hour.
    - cron: "41 5 * * *"
  # Also on pull requests that change anything the check's verdict depends on,
  # so the live assets are checked against that code before it ships:
  # - the extension module. Every downloaded manifest goes through
  #   `validate_app` in extensions.rs.
  # - plugin-host, which parses the manifest and checks each binding against
  #   its target capability (`PluginHost::binding_problems`).
  # - the reader capabilities those bindings target, whose input schemas and
  #   annotations are what gets checked: k8s.listCustomResource in crds.rs and
  #   k8s.listEvents in events.rs, registered in crates/registry/src/lib.rs,
  #   with schemas derived by crates/capability. gitops.rs, the inspection and
  #   actions behind the apps' resource views, sits beside them.
  pull_request:
    # The same target branches as ci.yml, `feat/ui-next` included: a shared
    # branch missing from this list runs no check at all (see ci.yml).
    branches: [dev, main, feat/ui-next]
    paths:
      - crates/registry/src/extensions.rs
      - crates/registry/src/extensions/**
      - crates/registry/src/lib.rs
      - crates/plugin-host/**
      - crates/capability/**
      - crates/kube/src/crds.rs
      - crates/kube/src/events.rs
      - crates/kube/src/gitops.rs
      - .github/workflows/extension-catalog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-catalog:
    name: live catalog and signatures
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Reads the repository and the public catalog; pushes nothing.
          persist-credentials: false
      # Pinned by SHA, so `toolchain` has to be explicit: this action reads the
      # ref it was called by to decide which toolchain to install, and a SHA
      # names no channel.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Live catalog, checksums and publisher signatures
        shell: bash
        run: |
          cargo test -p srelens-registry --lib -- \
            --ignored --exact --nocapture \
            extensions::catalog::tests::public_catalog_release_smoke 2>&1 | tee smoke.log
          # A renamed test matches no filter, and libtest reports zero tests
          # run as success. Green must mean the check actually ran.
          grep -q "test result: ok. 1 passed" smoke.log
