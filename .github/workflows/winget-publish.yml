name: Publish winget

# Opens pull requests against microsoft/winget-pkgs adding srelens.srectl (the
# CLI) and srelens.srelens (the desktop app) at a published version. Called by the release workflow after a stable release goes
# public, and runnable BY HAND for any already published version.
#
# Split out for the same reason `homebrew-publish.yml` and `aur-publish.yml`
# are: welded to the release pipeline, a failed submission could only be
# retried by cutting another release, which is how AUR sat four versions
# behind before it was separated. That matters more here than anywhere else,
# because this is the one channel whose outcome is decided by someone else —
# a submission is a pull request into a repository we do not own, and it can
# sit in moderation or be sent back for changes long after our release is
# done.
on:
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, without a leading v (e.g. 1.2.3)'
        required: true
        type: string
      package:
        description: 'srectl, srelens, or both'
        required: false
        type: string
        default: both
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to submit, without a leading v. Defaults to the newest stable release.'
        required: false
        type: string
      package:
        description: 'Which package to submit. Pick one to retry a submission that failed without opening a second pull request for the one that did not.'
        required: false
        type: choice
        options: [both, srectl, srelens]
        default: both

permissions:
  contents: read

# Two runs would open two pull requests for the same package version.
concurrency:
  group: winget-publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish winget
    # Windows because wingetcreate is a Windows binary, and because the
    # validation it runs is the same code path the winget client uses.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # winget-pkgs is Microsoft's repository: GITHUB_TOKEN cannot fork it, and
      # the submission is made as a person. Until someone sets the token this
      # skips rather than failing — a release should not go red because a
      # distribution channel is not set up yet. Same rule the Homebrew and AUR
      # publishes already follow.
      - name: Skip when the token isn't set up
        id: gate
        shell: bash
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "WINGET_TOKEN not set — skipping the winget submission."
            echo "See packaging/winget/README.md for what it needs."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.publish == 'true'
        with:
          node-version: 22

      # A manual run may omit the version, meaning "whatever the newest stable
      # release is". Resolved here rather than defaulted in the input, so the
      # log records which version was chosen.
      - name: Resolve version
        id: resolve
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PACKAGE: ${{ inputs.package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name // empty')
            VERSION="${TAG#srelens-v}"
            echo "No version given — using the newest stable release: ${TAG:-<none>}"
          fi
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${VERSION}' is not a stable X.Y.Z version. winget is a catalogue of stable software; a dev pre-release is not what someone typing 'winget install' is asking for."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # The release workflow passes no package: it wants both.
          case "${INPUT_PACKAGE:-both}" in
            both) PACKAGES="srectl srelens" ;;
            srectl|srelens) PACKAGES="$INPUT_PACKAGE" ;;
            *) echo "::error::unknown package '${INPUT_PACKAGE}'"; exit 1 ;;
          esac
          echo "packages=${PACKAGES}" >> "$GITHUB_OUTPUT"
          echo "Submitting ${PACKAGES} ${VERSION}"

      # Rendering reads the digest GitHub records for each release asset, so a
      # release missing the srectl archive or the desktop installer fails here
      # with that said plainly, rather than producing a manifest that 404s on a
      # stranger's machine after moderation has already approved it.
      - name: Render the manifests
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          # Read access to a public release; it only lifts the API rate limit.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        run: |
          set -euo pipefail
          # Only the packages being submitted, so a release missing the other
          # one's asset does not block this one.
          for p in $PACKAGES; do
            node packaging/winget/render.mjs "$VERSION" --out winget-out --package "$p"
          done
          echo "--- rendered manifests ---"
          for f in winget-out/manifests/s/srelens/*/"$VERSION"/*; do
            echo "=== $f"
            cat "$f"
          done

      - name: Get wingetcreate
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        run: |
          # The documented CI download. Not `winget install wingetcreate`,
          # which needs the winget client itself present on the runner.
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      # A shape check, not a schema check. `wingetcreate show` takes a package
      # identifier and reads winget-pkgs -- it does not parse a local directory,
      # so pointing it at one only fails the run. Schema validation is what
      # `submit` does before it opens anything, and winget-pkgs runs it again on
      # the pull request; the authoritative local equivalent is
      # `winget validate --manifest`, which needs the winget client and is in
      # packaging/winget/README.md for a human to run.
      #
      # What is left here is the cheap half worth catching before a submission:
      # that each package has all three files and its checksum really is one.
      - name: Check the rendered files
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            dir="winget-out/manifests/s/srelens/${p}/${VERSION}"
            for f in "srelens.${p}.yaml" \
                     "srelens.${p}.locale.en-US.yaml" \
                     "srelens.${p}.installer.yaml"; do
              [ -f "$dir/$f" ] || { echo "::error::render produced no $f"; exit 1; }
            done
            # `|| true`: under pipefail a grep that finds nothing would end the
            # script here, before the error below could say why.
            sha=$(grep -oE "InstallerSha256: [0-9A-Fa-f]{64}" "$dir/srelens.${p}.installer.yaml" | head -n 1 | cut -d" " -f2 || true)
            if [ -z "$sha" ]; then
              echo "::error::srelens.${p}.installer.yaml carries no 64-character InstallerSha256"
              cat "$dir/srelens.${p}.installer.yaml"
              exit 1
            fi
            echo "srelens.${p}: three manifests, InstallerSha256 ${sha}"
          done

      - name: Submit to microsoft/winget-pkgs
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PACKAGES: ${{ steps.resolve.outputs.packages }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          # One pull request per package. A failure does not stop the other:
          # the run fails at the end naming what was not submitted, and a
          # manual run with that `package` retries it alone.
          $failed = @()
          foreach ($p in $env:PACKAGES.Split(' ')) {
            $dir = "winget-out/manifests/s/srelens/$p/$env:VERSION"
            # --prtitle so the pull request says what it is in winget-pkgs's
            # very long list. The token forks winget-pkgs into its owner's
            # account and pushes a branch there; nothing is written to this
            # repository.
            ./wingetcreate.exe submit `
              --token $env:WINGET_TOKEN `
              --prtitle "New version: srelens.$p version $env:VERSION" `
              $dir
            if ($LASTEXITCODE -ne 0) {
              Write-Output "::error::wingetcreate submit failed for srelens.$p"
              $failed += $p
            }
          }
          if ($failed) { throw "not submitted: $($failed -join ', ')" }

      - name: Say what happens next
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          PACKAGES: ${{ steps.resolve.outputs.packages }}
        run: |
          echo "::notice::Submitted ${PACKAGES} ${VERSION} to microsoft/winget-pkgs. Each is a pull request there: automated validation runs first, then a human moderates it, so publication lags this run by hours or more. Watch https://github.com/microsoft/winget-pkgs/pulls?q=srelens"
