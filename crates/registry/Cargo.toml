[package]
name = "srelens-registry"
version.workspace = true
edition.workspace = true

[dependencies]
srelens-plugin-host = { path = "../plugin-host" }
srelens-capability = { path = "../capability" }
srelens-kube = { path = "../kube" }
# `kind_resolver` returns `dyn srelens_mcp::resources::KindResolver`, so this is
# real API surface, not test-only. `crates/mcp` also has `srelens-registry` as
# a dev-dependency (for its own e2e prompt test), making this a dev-only cycle:
# registry's real dependency on mcp, plus mcp's dev-only dependency on
# registry. Cargo permits this because neither library build depends on the
# other; confirmed via `cargo check -p srelens-registry -p srelens-mcp`.
srelens-mcp = { path = "../mcp" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the extension inventory is read, saved and read again; without it a
# number in an app's settings or manifest moved a step on each save.
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "0.8"
dirs = "6"
# Blocking HTTP for toolbox downloads (run inside spawn_blocking). rustls with
# NO auto crypto-provider: the workspace standardises on ring via kube-client;
# a second provider (aws-lc-rs) causes a runtime "could not determine
# CryptoProvider" panic. Mirrors apps/desktop/src-tauri/Cargo.toml.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
libc = "0.2"
# `durable` warns when a save could not be made durable; the desktop app routes `log`.
log = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time"] }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
ring = "0.17"
semver = "1"

# Windows: `durable::replace` renames with `MoveFileExW` and `MOVEFILE_WRITE_THROUGH`.
# Already in the lockfile through tempfile and others; no new crate is built.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[features]
# Exposes `srelens_registry::fuzzing`, the extension readers' fuzz entry points,
# to the targets in `fuzz/`. Test support, not an API.
fuzzing = []

[dev-dependencies]
# The property tests start from valid documents and edit them with plugin-host's
# test support.
srelens-plugin-host = { path = "../plugin-host", features = ["fuzzing"] }
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "test-util"] }
