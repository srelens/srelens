[package]
name = "srelens-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
srelens-capability = { path = "../capability" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
semver = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
srelens-registry = { path = "../registry" }
srelens-mcp = { path = "../mcp" }
tokio = { version = "1", features = ["macros", "rt", "io-std"] }
