[package]
name = "srelens-capability"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
# Scrubbing the values redaction hid out of an error message replaces many
# needles in one pass; a scan per value made recording a denied call quadratic
# in the number of arguments (#625).
aho-corasick = "1.1.5"
# A repo URL in an audited argument carries its credentials in the userinfo
# and in query parameters; keeping the rest of the URL readable means taking
# it apart properly rather than with a regex.
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
serde = { version = "1", features = ["derive"] }
