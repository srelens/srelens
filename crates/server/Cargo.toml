[package]
name = "srelens-server"
version.workspace = true
edition.workspace = true

[dependencies]
srelens-capability = { path = "../capability" }
srelens-kube = { path = "../kube" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
axum = "0.7"
rust-embed = "8"
mime_guess = "2"
aes-gcm = "0.10"
hex = "0.4"
getrandom = "0.2"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
async-trait = "0.1"
openidconnect = { version = "3", default-features = false, features = ["reqwest", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
schemars = "0.8"
tempfile = "3"
